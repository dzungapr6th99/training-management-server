<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 288" width="960" height="288" role="img" aria-labelledby="ttl dsc"><title id="ttl">Chi phí</title><desc id="dsc">Small multiples: train hours, train memory, inference latency</desc>
<style>
svg{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#8a8984;--grid:#e6e5e0;--axis:#c9c8c2;
--act:#2a78d6;--smolvla:#eb6834;--groot:#1baf7a;--pi05:#eda100;--ref:#52514e;
font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
@media (prefers-color-scheme:dark){svg{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#8f8e88;--grid:#2c2c2a;
--axis:#45443f;--act:#3987e5;--smolvla:#d95926;--groot:#199e70;--pi05:#c98500;--ref:#c3c2b7;}}
.bg{fill:var(--surface)} .t{fill:var(--ink);font-size:15px;font-weight:600} .st{fill:var(--ink2);font-size:12px}
.lab{fill:var(--ink2);font-size:12px} .val{fill:var(--ink);font-size:11px} .na{fill:var(--muted);font-size:11px;font-style:italic}
.grid{stroke:var(--grid);stroke-width:1} .axis{stroke:var(--axis);stroke-width:1}
.ci{stroke:var(--ink);stroke-width:1.5} .ref{stroke:var(--ref);stroke-width:1.5;stroke-dasharray:4 3}
.act{fill:var(--act)} .smolvla{fill:var(--smolvla)} .groot{fill:var(--groot)} .pi05{fill:var(--pi05)}
.ref-mark{fill:var(--ref)} .on-bar{fill:#fff}
.dot-act{fill:var(--act);stroke:var(--surface);stroke-width:2} .dot-smolvla{fill:var(--smolvla);stroke:var(--surface);stroke-width:2}
</style><rect class="bg" width="960" height="288"/><text x="20" y="30" class="t">Chi phí train và độ trễ suy luận</text><text x="20" y="50" class="st">mỗi ô một đại lượng, trục riêng; RTX 4070 Ti SUPER 16 GB</text><rect x="20" y="66" width="12" height="12" rx="3" class="act"/><text x="38" y="76" class="lab">ACT</text><rect x="74" y="66" width="12" height="12" rx="3" class="smolvla"/><text x="92" y="76" class="lab">SmolVLA</text><rect x="160" y="66" width="12" height="12" rx="3" class="groot"/><text x="178" y="76" class="lab">GR00T N1.7</text><text x="20.0" y="110" class="lab" font-weight="600">Giờ train (GPU, wall)</text><path d="M20.0,124.0 H257.5 Q261.5,124.0 261.5,128.0 V136.0 Q261.5,140.0 257.5,140.0 H20.0 Z" class="act"><title>ACT: 2.29 h · 100000 step</title></path><text x="255.5" y="136.5" text-anchor="end" class="val on-bar">ACT 2.29 h · 100000 step</text><path d="M20.0,154.0 H272.2 Q276.2,154.0 276.2,158.0 V166.0 Q276.2,170.0 272.2,170.0 H20.0 Z" class="smolvla"><title>SmolVLA: 2.43 h · 40000 step</title></path><text x="270.2" y="166.5" text-anchor="end" class="val on-bar">SmolVLA 2.43 h · 40000 step</text><path d="M20.0,184.0 H266.8 Q270.8,184.0 270.8,188.0 V196.0 Q270.8,200.0 266.8,200.0 H20.0 Z" class="groot"><title>GR00T N1.7: 2.38 h · 20000 step</title></path><text x="264.8" y="196.5" text-anchor="end" class="val on-bar">GR00T N1.7 2.38 h · 20000 step</text><line x1="20.0" x2="20.0" y1="118" y2="214" class="axis"/><text x="336.6666666666667" y="110" class="lab" font-weight="600">Bộ nhớ train (log lerobot)</text><path d="M336.7,124.0 H358.3 Q362.3,124.0 362.3,128.0 V136.0 Q362.3,140.0 358.3,140.0 H336.7 Z" class="act"><title>ACT: 1.6 GB · batch 8</title></path><text x="368.3" y="136.5" text-anchor="start" class="val">ACT 1.6 GB · batch 8</text><path d="M336.7,154.0 H389.8 Q393.8,154.0 393.8,158.0 V166.0 Q393.8,170.0 389.8,170.0 H336.7 Z" class="smolvla"><title>SmolVLA: 3.6 GB · batch 8</title></path><text x="399.8" y="166.5" text-anchor="start" class="val">SmolVLA 3.6 GB · batch 8</text><path d="M336.7,184.0 H536.5 Q540.5,184.0 540.5,188.0 V196.0 Q540.5,200.0 536.5,200.0 H336.7 Z" class="groot"><title>GR00T N1.7: 12.7 GB · batch 8</title></path><text x="534.5" y="196.5" text-anchor="end" class="val on-bar">GR00T N1.7 12.7 GB · batch 8</text><line x1="336.6666666666667" x2="336.6666666666667" y1="118" y2="214" class="axis"/><line x1="592.8" x2="592.8" y1="118" y2="214" class="ref"/><text x="592.8" y="230" text-anchor="end" class="st">16 GB GPU</text><text x="653.3333333333334" y="110" class="lab" font-weight="600">Độ trễ infer TB phía sim</text><path d="M653.3,124.0 H660.9 Q664.9,124.0 664.9,128.0 V136.0 Q664.9,140.0 660.9,140.0 H653.3 Z" class="act"><title>ACT: 29 ms</title></path><text x="670.9" y="136.5" text-anchor="start" class="val">ACT 29 ms</text><path d="M653.3,154.0 H792.7 Q796.7,154.0 796.7,158.0 V166.0 Q796.7,170.0 792.7,170.0 H653.3 Z" class="smolvla"><title>SmolVLA: 358 ms</title></path><text x="802.7" y="166.5" text-anchor="start" class="val">SmolVLA 358 ms</text><line x1="653.3333333333334" x2="653.3333333333334" y1="118" y2="214" class="axis"/><line x1="909.5" x2="909.5" y1="118" y2="214" class="ref"/><text x="909.5" y="230" text-anchor="end" class="st">ngân sách 640 ms</text><text x="20" y="274" class="st">ACT gồm 2 đoạn train (0–20k + resume). Độ trễ đo khi 2 worker eval dùng chung GPU; ngân sách = exec-steps / 25 Hz. GR00T chưa eval nên không có độ trễ.</text></svg>
