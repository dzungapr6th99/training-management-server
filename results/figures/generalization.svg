<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 264" width="760" height="264" role="img" aria-labelledby="ttl dsc"><title id="ttl">Tổng quát hoá</title><desc id="dsc">Dot plot of split/in-dist success ratio</desc>
<style>
svg{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#8a8984;--grid:#e6e5e0;--axis:#c9c8c2;
--act:#2a78d6;--smolvla:#eb6834;--groot:#1baf7a;--pi05:#eda100;--ref:#52514e;
font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
@media (prefers-color-scheme:dark){svg{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#8f8e88;--grid:#2c2c2a;
--axis:#45443f;--act:#3987e5;--smolvla:#d95926;--groot:#199e70;--pi05:#c98500;--ref:#c3c2b7;}}
.bg{fill:var(--surface)} .t{fill:var(--ink);font-size:15px;font-weight:600} .st{fill:var(--ink2);font-size:12px}
.lab{fill:var(--ink2);font-size:12px} .val{fill:var(--ink);font-size:11px} .na{fill:var(--muted);font-size:11px;font-style:italic}
.grid{stroke:var(--grid);stroke-width:1} .axis{stroke:var(--axis);stroke-width:1}
.ci{stroke:var(--ink);stroke-width:1.5} .ref{stroke:var(--ref);stroke-width:1.5;stroke-dasharray:4 3}
.act{fill:var(--act)} .smolvla{fill:var(--smolvla)} .groot{fill:var(--groot)} .pi05{fill:var(--pi05)}
.ref-mark{fill:var(--ref)} .on-bar{fill:#fff}
.dot-act{fill:var(--act);stroke:var(--surface);stroke-width:2} .dot-smolvla{fill:var(--smolvla);stroke:var(--surface);stroke-width:2}
</style><rect class="bg" width="760" height="264"/><text x="20" y="30" class="t">Tỉ lệ thành công ngoài phân phối so với in-dist</text><text x="20" y="50" class="st">tỉ số = rate(split) / rate(in-dist) cùng model và mức; 1.0 = không tụt; 0.5 = ngưỡng G7 cho wide</text><circle cx="26.0" cy="72.0" r="6" class="ref-mark"/><text x="36" y="76" class="lab">heldout màu</text><rect x="150.5" y="66.5" width="11" height="11" rx="2" class="ref-mark"/><text x="166" y="76" class="lab">heldout hình</text><path d="M286.0,65.0 L293.0,72.0 L286.0,79.0 L279.0,72.0 Z" class="ref-mark"/><text x="296" y="76" class="lab">wide</text><line x1="150.0" x2="150.0" y1="86" y2="194" class="grid"/><text x="150.0" y="212" text-anchor="middle" class="lab">0.00</text><line x1="219.0" x2="219.0" y1="86" y2="194" class="grid"/><text x="219.0" y="212" text-anchor="middle" class="lab">0.25</text><line x1="288.1" x2="288.1" y1="86" y2="194" class="grid"/><text x="288.1" y="212" text-anchor="middle" class="lab">0.50</text><line x1="357.1" x2="357.1" y1="86" y2="194" class="grid"/><text x="357.1" y="212" text-anchor="middle" class="lab">0.75</text><line x1="426.2" x2="426.2" y1="86" y2="194" class="grid"/><text x="426.2" y="212" text-anchor="middle" class="lab">1.00</text><line x1="495.2" x2="495.2" y1="86" y2="194" class="grid"/><text x="495.2" y="212" text-anchor="middle" class="lab">1.25</text><line x1="564.3" x2="564.3" y1="86" y2="194" class="grid"/><text x="564.3" y="212" text-anchor="middle" class="lab">1.50</text><line x1="633.3" x2="633.3" y1="86" y2="194" class="grid"/><text x="633.3" y="212" text-anchor="middle" class="lab">1.75</text><line x1="702.4" x2="702.4" y1="86" y2="194" class="grid"/><text x="702.4" y="212" text-anchor="middle" class="lab">2.00</text><line x1="426.2" x2="426.2" y1="86" y2="194" class="axis" stroke-width="2"/><line x1="288.1" x2="288.1" y1="86" y2="194" class="ref"/><text x="138" y="113.0" text-anchor="end" class="lab">ACT L1 (28%)</text><g><circle cx="406.5" cy="109.0" r="6" class="dot-act"/><title>ACT L1 heldout màu: 13/50 vs in-dist 14/50 → ×0.93</title></g><g><rect x="420.7" y="103.5" width="11" height="11" rx="2" class="dot-act"/><title>ACT L1 heldout hình: 14/50 vs in-dist 14/50 → ×1.00</title></g><g><path d="M150.0,102.0 L157.0,109.0 L150.0,116.0 L143.0,109.0 Z" class="dot-act"/><title>ACT L1 wide: 0/50 vs in-dist 14/50 → ×0.00</title></g><text x="138" y="147.0" text-anchor="end" class="lab">SmolVLA L1 (24%)</text><g><circle cx="311.1" cy="143.0" r="6" class="dot-smolvla"/><title>SmolVLA L1 heldout màu: 7/50 vs in-dist 12/50 → ×0.58</title></g><g><rect x="351.6" y="137.5" width="11" height="11" rx="2" class="dot-smolvla"/><title>SmolVLA L1 heldout hình: 9/50 vs in-dist 12/50 → ×0.75</title></g><g><path d="M150.0,136.0 L157.0,143.0 L150.0,150.0 L143.0,143.0 Z" class="dot-smolvla"/><title>SmolVLA L1 wide: 0/50 vs in-dist 12/50 → ×0.00</title></g><text x="138" y="181.0" text-anchor="end" class="lab">SmolVLA L2 (6%)</text><g><circle cx="702.4" cy="177.0" r="6" class="dot-smolvla"/><title>SmolVLA L2 heldout màu: 6/50 vs in-dist 3/50 → ×2.00</title></g><g><rect x="604.8" y="171.5" width="11" height="11" rx="2" class="dot-smolvla"/><title>SmolVLA L2 heldout hình: 5/50 vs in-dist 3/50 → ×1.67</title></g><g><path d="M150.0,170.0 L157.0,177.0 L150.0,184.0 L143.0,177.0 Z" class="dot-smolvla"/><title>SmolVLA L2 wide: 0/50 vs in-dist 3/50 → ×0.00</title></g><text x="20" y="250" class="st">Mẫu nhỏ (k ≤ 15/50 ở in-dist): tỉ số dao động mạnh, chỉ đọc xu hướng; số tuyệt đối ở biểu đồ tỉ lệ thành công.</text></svg>
